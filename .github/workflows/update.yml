name: Update A-Share Data
on:
  schedule:
    - cron: '10 7 * * 1-5' # 北京时间每个交易日 15:10 自动运行
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.10'
        - run: pip install akshare pandas
        - run: python fetch_data.py
        - run: |
            git config user.name "AutoBot"
            git config user.email "bot@noreply.github.com"
            git add data.json
            git commit -m "Update daily A-share limit-up data" || exit 0
            git push
